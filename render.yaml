services:
  - type: web
    name: timezone-optimizer-api
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt --no-cache-dir
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: src
      - key: PORT
        value: 10000
    healthCheckPath: /health
    autoDeploy: true
    branch: main
