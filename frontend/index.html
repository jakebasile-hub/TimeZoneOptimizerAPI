<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeZone Optimizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .form-container {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4facfe;
        }

        .participant-group {
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background: #f8f9fa;
        }

        .participant-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .remove-participant {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-participant {
            background: #2ed573;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        .results h3 {
            color: #333;
            margin-bottom: 20px;
        }

        .best-time {
            background: #2ed573;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alternative {
            background: white;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .error {
            background: #ff4757;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .api-key-section {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .api-key-section h4 {
            color: #856404;
            margin-bottom: 10px;
        }

        .api-key-section p {
            color: #856404;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 TimeZone Optimizer</h1>
            <p>Find the perfect meeting time for your global team</p>
        </div>

        <div class="form-container">
            <div class="api-key-section">
                <h4>🔑 API Key Required</h4>
                <p>Enter your API key to use the optimizer. Get one by calling the /create-key endpoint.</p>
            </div>

            <form id="optimizer-form">
                <div class="form-group">
                    <label for="api-key">API Key:</label>
                    <input type="text" id="api-key" placeholder="Enter your API key" required>
                </div>

                <div class="form-group">
                    <label for="duration">Meeting Duration (minutes):</label>
                    <select id="duration">
                        <option value="30">30 minutes</option>
                        <option value="60" selected>60 minutes</option>
                        <option value="90">90 minutes</option>
                        <option value="120">2 hours</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="alternatives">Number of Alternatives:</label>
                    <select id="alternatives">
                        <option value="1">1 alternative</option>
                        <option value="2">2 alternatives</option>
                        <option value="3" selected>3 alternatives</option>
                    </select>
                </div>

                <div id="participants-container">
                    <h3>Participants</h3>
                    <div class="participant-group" data-index="0">
                        <div class="participant-header">
                            <h4>Participant 1</h4>
                            <button type="button" class="remove-participant" onclick="removeParticipant(0)" style="display: none;">Remove</button>
                        </div>
                        <div class="form-group">
                            <label>Name:</label>
                            <input type="text" name="name" placeholder="e.g., Alice" required>
                        </div>
                        <div class="form-group">
                            <label>Location:</label>
                            <input type="text" name="location" placeholder="e.g., New York, USA" required>
                        </div>
                    </div>
                </div>

                <button type="button" class="add-participant" onclick="addParticipant()">+ Add Participant</button>

                <button type="submit" class="submit-btn">Find Optimal Time</button>
            </form>

            <div class="loading" id="loading">
                <p>🔄 Finding the best meeting time...</p>
            </div>

            <div class="error" id="error"></div>

            <div class="results" id="results">
                <h3>📅 Optimal Meeting Time</h3>
                <div id="best-time"></div>
                <div id="alternatives"></div>
            </div>
        </div>
    </div>

    <script>
        let participantCount = 1;

        function addParticipant() {
            const container = document.getElementById('participants-container');
            const newIndex = participantCount++;
            
            const participantDiv = document.createElement('div');
            participantDiv.className = 'participant-group';
            participantDiv.setAttribute('data-index', newIndex);
            
            participantDiv.innerHTML = `
                <div class="participant-header">
                    <h4>Participant ${newIndex + 1}</h4>
                    <button type="button" class="remove-participant" onclick="removeParticipant(${newIndex})">Remove</button>
                </div>
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" name="name" placeholder="e.g., Bob" required>
                </div>
                <div class="form-group">
                    <label>Location:</label>
                    <input type="text" name="location" placeholder="e.g., London, UK" required>
                </div>
            `;
            
            container.appendChild(participantDiv);
            
            // Show remove buttons for all participants if we have more than 1
            if (participantCount > 1) {
                document.querySelectorAll('.remove-participant').forEach(btn => btn.style.display = 'inline-block');
            }
        }

        function removeParticipant(index) {
            const participant = document.querySelector(`[data-index="${index}"]`);
            if (participant) {
                participant.remove();
                participantCount--;
                
                // Hide remove buttons if we only have 1 participant
                if (participantCount <= 1) {
                    document.querySelectorAll('.remove-participant').forEach(btn => btn.style.display = 'none');
                }
            }
        }

        document.getElementById('optimizer-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const results = document.getElementById('results');
            
            // Hide previous results/errors
            error.style.display = 'none';
            results.style.display = 'none';
            loading.style.display = 'block';
            
            try {
                // Collect form data
                const apiKey = document.getElementById('api-key').value;
                const duration = parseInt(document.getElementById('duration').value);
                const alternatives = parseInt(document.getElementById('alternatives').value);
                
                const participants = [];
                document.querySelectorAll('.participant-group').forEach(group => {
                    const name = group.querySelector('input[name="name"]').value;
                    const location = group.querySelector('input[name="location"]').value;
                    if (name && location) {
                        participants.push({ name, location });
                    }
                });
                
                if (participants.length < 2) {
                    throw new Error('At least 2 participants are required');
                }
                
                // Make API request
                const response = await fetch('/optimize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': apiKey
                    },
                    body: JSON.stringify({
                        participants,
                        duration_minutes: duration,
                        num_alternatives: alternatives
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'API request failed');
                }
                
                const data = await response.json();
                
                // Display results
                displayResults(data);
                
            } catch (err) {
                error.textContent = `Error: ${err.message}`;
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        });

        function displayResults(data) {
            const results = document.getElementById('results');
            const bestTime = document.getElementById('best-time');
            const alternatives = document.getElementById('alternatives');
            
            // Display best time
            bestTime.innerHTML = `
                <h4>🎯 Best Meeting Time</h4>
                <p><strong>UTC Time:</strong> ${data.best_meeting_time_utc}</p>
                <div style="margin-top: 15px;">
                    <h5>Local Times:</h5>
                    ${data.local_times.map(lt => 
                        `<p><strong>${lt.name}:</strong> ${lt.local_time}</p>`
                    ).join('')}
                </div>
            `;
            
            // Display alternatives
            if (data.alternatives && data.alternatives.length > 0) {
                alternatives.innerHTML = `
                    <h4>🔄 Alternative Times</h4>
                    ${data.alternatives.map((alt, index) => 
                        `<div class="alternative">
                            <p><strong>Option ${index + 1}:</strong> ${alt.utc_time}</p>
                            <p><strong>Fairness Score:</strong> ${(alt.fairness_score * 100).toFixed(1)}%</p>
                        </div>`
                    ).join('')}
                `;
            } else {
                alternatives.innerHTML = '';
            }
            
            results.style.display = 'block';
        }
    </script>
</body>
</html>
